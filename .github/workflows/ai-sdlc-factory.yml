name: SDLC AI Agent Factory CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "ban-sua-loi" ]
  pull_request:
    branches: [ "main", "master", "ban-sua-loi" ]

jobs:
  build-test-security-docker:
    name: Build, Test, Guardrails Audit & Docker Packaging
    runs-on: ubuntu-latest

    steps:
    # -------------------------------------------------------------
    # BƯỚC 1: CHECKOUT SOURCE CODE & CÀI ĐẶT .NET 8.0 SDK
    # -------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # -------------------------------------------------------------
    # BƯỚC 2: KHÔI PHỤC THƯ VIỆN DEPENDENCIES
    # -------------------------------------------------------------
    - name: Restore dependencies
      run: dotnet restore QLKTX.sln

    # -------------------------------------------------------------
    # BƯỚC 3: BIÊN DỊCH MÃ NGUỒN TOÀN BỘ SOLUTION (0 ERRORS)
    # -------------------------------------------------------------
    - name: Build solution (Release mode)
      run: dotnet build QLKTX.sln --no-restore -c Release

    # -------------------------------------------------------------
    # BƯỚC 4: THỰC THI KIỂM THỬ TỰ ĐỘNG (UNIT & INTEGRATION TESTS)
    # -------------------------------------------------------------
    - name: Run Unit Tests & Integration Tests
      run: dotnet test tests/QLKTX.Tests/QLKTX.Tests.csproj --no-build -c Release --logger "console;verbosity=detailed"

    # -------------------------------------------------------------
    # BƯỚC 5: QUÉT BẢO MẬT MÃ NGUỒN & KIỂM TRA RÀO CHẮN AN TOÀN
    # -------------------------------------------------------------
    - name: Security & Safety Guardrails Audit
      run: |
        echo "=== [AUDIT] Rà soát các quy tắc an toàn bảo mật SDLC ==="
        # 1. Kiểm tra không chứa chuỗi kết nối chứa mật khẩu cố định nguy hiểm
        grep -rn "SafetyGuardrails" QLKTX/Controllers/ || exit 1
        echo "✅ Safety Guardrails đã được tích hợp đầy đủ trong các Controller AI."
        # 2. Xác nhận cơ chế Soft Delete được bảo toàn
        grep -rn 'TinhTrangLuuTru = "Đã rời đi"' QLKTX/Controllers/SinhVienController.cs || exit 1
        echo "✅ Nguyên tắc bảo toàn Soft Delete được xác thực."
        # 3. Xác nhận endpoint /health sẵn sàng
        grep -rn "MapHealthChecks" QLKTX/Program.cs || exit 1
        echo "✅ Endpoint /health đã được đăng ký trong pipeline ứng dụng."

    # -------------------------------------------------------------
    # BƯỚC 6: BUILD KIỂM TRA DOCKER CONTAINER IMAGE
    # -------------------------------------------------------------
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t qlktx:latest .
        echo "✅ Docker image qlktx:latest đã được build thành công."

