version: '3.8'

services:
  qlktx-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qlktx_web
    ports:
      - "5013:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=QLKTX;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;
      - Ollama__BaseUrl=http://host.docker.internal:11434/api/chat
      - Ollama__Model=llama3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

