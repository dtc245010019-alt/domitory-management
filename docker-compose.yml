version: '3.8'

services:
  qlktx-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qlktx_web
    ports:
      - "5013:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Ollama__BaseUrl=http://host.docker.internal:11434/api/chat
      - Ollama__Model=llama3
    restart: unless-stopped

