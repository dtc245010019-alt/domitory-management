version: '3.8'

services:
  qlktx-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qlktx_web
    ports:
      - "5013:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=QLKTX;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;
      - Ollama__BaseUrl=http://host.docker.internal:11434/api/chat
      - Ollama__Model=llama3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


